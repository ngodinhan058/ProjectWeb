server {
    listen 80;
    server_name localhost;

    # Root là thư mục chứa bản build React
    root /usr/share/nginx/html;

    index index.html;

    # Chuyển hướng tất cả các request không tìm thấy file về index.html
    location / {
        try_files $uri /index.html;
    }

    # Xử lý các file tĩnh nếu cần
    location /static/ {
        autoindex off;
    }

    # Tùy chọn: Xử lý lỗi (không bắt buộc)
    error_page 404 /index.html;
}
